name: Specification Tracking
description: Track the progress of a specification (RFC, TSY, SPEC, ERR, AD) through review and implementation
title: '[Spec Tracking]: '
labels:
  - spec-tracking
body:
  - type: markdown
    id: intro
    attributes:
      value: |-
        This issue tracks the progress of a specification through review, approval, and implementation.

        **Specification Lifecycle:**
        - **draft** -> **proposed** -> **accepted**/rejected -> **unstable** -> **stable**

        Link this issue to the original feature request that initiated this specification.
  - type: input
    id: spec-id
    attributes:
      label: Specification ID
      description: The specification identifier (e.g., RFC-0032, SPEC-0024, TSY-0015)
      placeholder: RFC-0032
    validations:
      required: true
  - type: input
    id: feature-issue
    attributes:
      label: Related Feature Request
      description: Link to the original feature request issue
      placeholder: '#123'
    validations:
      required: true
  - type: dropdown
    id: spec-type
    attributes:
      label: Specification Type
      description: What type of specification is this?
      options:
        - AD (Architecture Decision)
        - RFC (Request for Comment)
        - SPEC (Technical Specification)
        - TSY (Type System)
        - CG (Code Generation)
        - PERF (Performance)
        - INTEG (Integration Testing)
        - UNIT (Unit Testing)
        - E2E (End-to-End Testing)
        - ERR (Error Handling)
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current Status
      description: What is the current status of this specification?
      options:
        - draft
        - proposed
        - accepted
        - rejected
        - unstable
        - stable
        - deprecated
        - superseded
      default: 0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Specification Summary
      description: Brief summary of what this specification defines
      placeholder: This RFC defines the design and rationale for...
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Working Branch
      description: The branch where this specification is being developed
      placeholder: feature/rfc-0032-new-feature
    validations:
      required: false
  - type: input
    id: pr
    attributes:
      label: Pull Request
      description: Link to the PR for this specification (if opened)
      placeholder: '#124'
    validations:
      required: false
  - type: checkboxes
    id: review-checklist
    attributes:
      label: Review Checklist
      description: Items that must be completed before advancing to 'proposed' status
      options:
        - label: Specification follows the template structure for its type
        - label: All required sections are complete
        - label: Examples are comprehensive and correct
        - label: Cross-references to related specs are included
        - label: Frontmatter is complete (author, components, version_after, etc.)
        - label: Specification uses Canadian English spelling
        - label: No emojis in specification content
        - label: Code blocks use expressive-code markers where appropriate
    validations:
      required: false
  - type: checkboxes
    id: approval-checklist
    attributes:
      label: Approval Checklist
      description: Items that must be completed before advancing to 'accepted' status
      options:
        - label: At least two maintainer approvals
        - label: Community feedback period completed (if applicable)
        - label: All review comments addressed
        - label: Related specifications identified (TSY, SPEC, ERR)
        - label: Implementation plan documented
    validations:
      required: false
  - type: checkboxes
    id: related-specs
    attributes:
      label: Related Specifications
      description: Which companion specifications are needed?
      options:
        - label: AD - High-level architectural decisions and design principles for Kintsu.
        - label: RFC - Proposals for new features or changes to existing features in Kintsu.
        - label: SPEC - Detailed technical specifications for Kintsu features and modules.
        - label: TSY - Specifications related to the type system in Kintsu.
        - label: CG - Specifications for the code generation process in Kintsu.
        - label: PERF - Specifications focused on performance optimizations and benchmarks for Kintsu.
        - label: INTEG - Specifications for integration tests covering multiple components of Kintsu.
        - label: UNIT - Specifications for unit tests targeting individual components of Kintsu.
        - label: E2E - Specifications for end-to-end tests validating complete workflows in Kintsu.
        - label: ERR - Error codes and reporting mechanisms in Kintsu.
    validations:
      required: false
  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: Notes about implementation status or dependencies
      placeholder: |-
        - Implementation started in PR #XXX
        - Depends on RFC-XXXX being implemented first
        - Blocked by: ...
    validations:
      required: false
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Expected timeline for completion
      placeholder: |-
        - Draft complete: YYYY-MM-DD
        - Proposed: YYYY-MM-DD
        - Accepted: YYYY-MM-DD
        - Implementation: YYYY-MM-DD
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any other relevant information
      placeholder: Notes about design decisions, open questions, or blockers
    validations:
      required: false
